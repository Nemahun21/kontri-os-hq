name: V2 Flutter checks
on:
  push:
    branches: [develop/v2]
  pull_request:
    branches: [develop/v2]
jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter tests
        run: flutter test
